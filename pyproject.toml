[build-system]
requires = [
    "setuptools >= 61; python_version < '3.14'",
    "setuptools >= 77.0.3; python_version >= '3.14'",
    "wheel",
]
[tool.black]
line-length = 80
target-version = ['py37']
include = '\.pyi?$'
# 'extend-exclude' excludes files or directories in addition to the defaults
extend-exclude = '''
(
  ^/versioneer.py
  | docs/source/conf.py
  | _datalad_buildsupport/*
  | datalad_catalog/_version.py
)
'''